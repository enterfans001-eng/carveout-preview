<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fcff"/>
      <stop offset="0.52" stop-color="#eef9ff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#25258b" flood-opacity="0.10"/>
    </filter>
    <style>
      .blue{fill:#25258b}
      .ink{fill:#111426}
      .muted{fill:#686d82}
      .small{font-family:Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;font-size:22px;font-weight:800}
      .body{font-family:Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;font-size:24px;font-weight:800;line-height:1.8}
      .ja{font-family:Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;font-weight:900}
      .en{font-family:Arial, sans-serif;font-weight:400;letter-spacing:0}
    </style>
  </defs>
  <rect width="1440" height="980" fill="url(#bg)"/>
  <circle cx="1180" cy="118" r="210" fill="#25258b" opacity="0.045"/>
  <circle cx="160" cy="760" r="260" fill="#dff8ff" opacity="0.55"/>

  <g transform="translate(86 86)">
    <rect x="0" y="0" width="4" height="130" rx="2" fill="#dff8ff"/>
    <text x="38" y="78" class="en blue" font-size="112">MANAGER</text>
    <text x="42" y="148" class="ja blue" font-size="42">マネージャー紹介</text>
    <text x="42" y="202" class="small muted">SUPPORTセクションの下に追加する想定。あなたの活動を支える専属マネージャーを紹介します。</text>
  </g>

  <g transform="translate(92 336)">
    <rect x="0" y="0" width="1256" height="488" rx="16" fill="url(#card)" stroke="#dfe3f5" filter="url(#shadow)"/>
    <g transform="translate(42 46)">
      <rect x="0" y="0" width="362" height="396" rx="14" fill="#fff" stroke="#dfe3f5"/>
      <rect x="28" y="28" width="4" height="96" rx="2" fill="#25258b" opacity="0.62"/>
      <circle cx="108" cy="84" r="54" fill="#eef7ff" stroke="#dfe3f5"/>
      <text x="184" y="70" class="small blue">専属マネージャー</text>
      <text x="184" y="112" class="ja ink" font-size="30">NAME 01</text>
      <text x="42" y="176" class="small blue">担当サポート</text>
      <text x="42" y="216" class="body muted">プロフィール設計 / 配信テーマ整理</text>
      <text x="42" y="270" class="small blue">メッセージ</text>
      <text x="42" y="310" class="body muted">初配信までの準備を一緒に整理し、</text>
      <text x="42" y="344" class="body muted">不安なくスタートできる状態へ。</text>
    </g>
    <g transform="translate(447 46)">
      <rect x="0" y="0" width="362" height="396" rx="14" fill="#fff" stroke="#dfe3f5"/>
      <rect x="28" y="28" width="4" height="96" rx="2" fill="#25258b" opacity="0.62"/>
      <circle cx="108" cy="84" r="54" fill="#eef7ff" stroke="#dfe3f5"/>
      <text x="184" y="70" class="small blue">専属マネージャー</text>
      <text x="184" y="112" class="ja ink" font-size="30">NAME 02</text>
      <text x="42" y="176" class="small blue">担当サポート</text>
      <text x="42" y="216" class="body muted">配信後の振り返り / 目標管理</text>
      <text x="42" y="270" class="small blue">メッセージ</text>
      <text x="42" y="310" class="body muted">コメントや視聴者の反応を見ながら、</text>
      <text x="42" y="344" class="body muted">次に試す改善案を提案。</text>
    </g>
    <g transform="translate(852 46)">
      <rect x="0" y="0" width="362" height="396" rx="14" fill="#fff" stroke="#dfe3f5"/>
      <rect x="28" y="28" width="4" height="96" rx="2" fill="#25258b" opacity="0.62"/>
      <circle cx="108" cy="84" r="54" fill="#eef7ff" stroke="#dfe3f5"/>
      <text x="184" y="70" class="small blue">専属マネージャー</text>
      <text x="184" y="112" class="ja ink" font-size="30">NAME 03</text>
      <text x="42" y="176" class="small blue">担当サポート</text>
      <text x="42" y="216" class="body muted">イベント戦略 / 案件挑戦</text>
      <text x="42" y="270" class="small blue">メッセージ</text>
      <text x="42" y="310" class="body muted">イベント参加や露出のチャンスを、</text>
      <text x="42" y="344" class="body muted">活動ペースに合わせて設計。</text>
    </g>
  </g>

  <g transform="translate(146 870)">
    <rect x="0" y="0" width="1148" height="54" rx="27" fill="#fff" stroke="#dfe3f5"/>
    <text x="54" y="36" class="small blue">相談</text>
    <text x="250" y="36" class="small muted">→</text>
    <text x="334" y="36" class="small blue">配信設計</text>
    <text x="560" y="36" class="small muted">→</text>
    <text x="640" y="36" class="small blue">初配信</text>
    <text x="836" y="36" class="small muted">→</text>
    <text x="916" y="36" class="small blue">振り返り・改善</text>
  </g>
</svg>
