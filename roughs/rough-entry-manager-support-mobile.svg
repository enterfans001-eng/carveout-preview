<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1280" viewBox="0 0 430 1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fcff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#25258b" flood-opacity="0.10"/>
    </filter>
    <style>
      .blue{fill:#25258b}
      .ink{fill:#111426}
      .muted{fill:#686d82}
      .small{font-family:Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;font-size:14px;font-weight:800}
      .body{font-family:Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;font-size:14px;font-weight:800}
      .ja{font-family:Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;font-weight:900}
      .en{font-family:Arial, sans-serif;font-weight:400;letter-spacing:0}
    </style>
  </defs>
  <rect width="430" height="1280" fill="url(#bg)"/>
  <circle cx="344" cy="92" r="110" fill="#25258b" opacity="0.045"/>

  <g transform="translate(28 54)">
    <rect x="0" y="0" width="4" height="94" rx="2" fill="#dff8ff"/>
    <text x="24" y="50" class="en blue" font-size="48">MANAGER</text>
    <text x="26" y="92" class="ja blue" font-size="23">マネージャー紹介</text>
    <text x="26" y="132" class="body muted">あなたの活動を支える</text>
    <text x="26" y="156" class="body muted">専属マネージャーを紹介します。</text>
  </g>

  <g transform="translate(24 286)">
    <rect x="0" y="0" width="382" height="252" rx="14" fill="url(#card)" stroke="#dfe3f5" filter="url(#shadow)"/>
    <rect x="24" y="26" width="4" height="74" rx="2" fill="#25258b" opacity="0.62"/>
    <circle cx="76" cy="66" r="40" fill="#eef7ff" stroke="#dfe3f5"/>
    <text x="132" y="52" class="small blue">専属マネージャー</text>
    <text x="132" y="84" class="ja ink" font-size="23">NAME 01</text>
    <text x="34" y="138" class="small blue">担当サポート</text>
    <text x="34" y="166" class="body muted">プロフィール設計 / 配信テーマ整理</text>
    <text x="34" y="204" class="small blue">メッセージ</text>
    <text x="34" y="230" class="body muted">初配信までの準備を一緒に整理。</text>
  </g>

  <g transform="translate(24 570)">
    <rect x="0" y="0" width="382" height="252" rx="14" fill="url(#card)" stroke="#dfe3f5" filter="url(#shadow)"/>
    <rect x="24" y="26" width="4" height="74" rx="2" fill="#25258b" opacity="0.62"/>
    <circle cx="76" cy="66" r="40" fill="#eef7ff" stroke="#dfe3f5"/>
    <text x="132" y="52" class="small blue">専属マネージャー</text>
    <text x="132" y="84" class="ja ink" font-size="23">NAME 02</text>
    <text x="34" y="138" class="small blue">担当サポート</text>
    <text x="34" y="166" class="body muted">配信後の振り返り / 目標管理</text>
    <text x="34" y="204" class="small blue">メッセージ</text>
    <text x="34" y="230" class="body muted">次に試す改善案を提案。</text>
  </g>

  <g transform="translate(24 854)">
    <rect x="0" y="0" width="382" height="252" rx="14" fill="url(#card)" stroke="#dfe3f5" filter="url(#shadow)"/>
    <rect x="24" y="26" width="4" height="74" rx="2" fill="#25258b" opacity="0.62"/>
    <circle cx="76" cy="66" r="40" fill="#eef7ff" stroke="#dfe3f5"/>
    <text x="132" y="52" class="small blue">専属マネージャー</text>
    <text x="132" y="84" class="ja ink" font-size="23">NAME 03</text>
    <text x="34" y="138" class="small blue">担当サポート</text>
    <text x="34" y="166" class="body muted">イベント戦略 / 案件挑戦</text>
    <text x="34" y="204" class="small blue">メッセージ</text>
    <text x="34" y="230" class="body muted">チャンスの活かし方を一緒に設計。</text>
  </g>

  <g transform="translate(42 1150)">
    <rect x="0" y="0" width="346" height="78" rx="39" fill="#fff" stroke="#dfe3f5"/>
    <text x="40" y="32" class="small blue">相談 → 配信設計 → 初配信</text>
    <text x="96" y="58" class="small blue">→ 振り返り・改善</text>
  </g>
</svg>
